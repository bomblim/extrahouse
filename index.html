<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로딩 중...</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hero">
    <div class="hero-content">
      <h1 id="site-title"></h1>
      <p class="subtitle" id="site-subtitle"></p>
    </div>
  </header>

  <nav class="nav">
    <ul id="nav-list"></ul>
  </nav>

  <main class="container" id="main-content">
    <div class="loading">콘텐츠를 불러오는 중...</div>
  </main>

  <footer class="footer">
    <p id="footer-text"></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    marked.setOptions({ breaks: true });

    async function fetchText(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${url} 불러오기 실패 (${res.status})`);
      return res.text();
    }

    async function loadSite() {
      const main = document.getElementById('main-content');

      let config;
      try {
        const json = await fetchText('menuStructure.json');
        config = JSON.parse(json);
      } catch (e) {
        main.innerHTML = `<p class="error">menuStructure.json을 불러올 수 없습니다: ${e.message}</p>`;
        return;
      }

      // 헤더 / 푸터 채우기
      document.title = config.title + ' - 이용 안내';
      document.getElementById('site-title').textContent   = config.title;
      document.getElementById('site-subtitle').textContent = config.subtitle ?? '';
      document.getElementById('footer-text').textContent  = config.footer ?? '';

      // 네비게이션 생성
      const navList = document.getElementById('nav-list');
      for (const item of config.menu) {
        const li = document.createElement('li');
        li.innerHTML = `<a href="#${item.id}">${item.label}</a>`;
        navList.appendChild(li);
      }

      // 섹션 생성 (순서 유지를 위해 순차 로드)
      main.innerHTML = '';
      for (const item of config.menu) {
        const section = document.createElement('section');
        section.id        = item.id;
        section.className = 'section';

        try {
          const md = await fetchText(item.file);
          section.innerHTML = marked.parse(md);
        } catch (e) {
          section.innerHTML = `<p class="error">${item.label} 콘텐츠를 불러올 수 없습니다.<br><small>${e.message}</small></p>`;
        }

        main.appendChild(section);
      }
    }

    loadSite();
  </script>
</body>
</html>
